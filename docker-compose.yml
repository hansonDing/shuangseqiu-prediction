# 本地 / 单机部署示例
#
# 用法：
#   1. 生成镜像： docker compose build
#   2. 启动：      docker compose up -d
#   3. 查看日志：  docker compose logs -f
#   4. 停止：      docker compose down
#
# 说明：数据落在命名卷 shuangseqiu-data（挂载到 /app/data），删除容器不会丢数据；
#      如需彻底重置，执行 docker compose down -v。
#      若改用 CloudBase PostgreSQL（STORAGE_DRIVER=cloudbase），数据在云数据库里，
#      下面的 volumes 与持久卷都可以去掉，容器变成无状态。详见 docs/deploy/Deploy.md 第 8.2 节。

services:
  shuangseqiu:
    build:
      context: .
      dockerfile: Dockerfile
    image: shuangseqiu-prediction:latest
    container_name: shuangseqiu
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Shanghai
      PORT: "5000"
      # 生产模式开关：src/server.ts 以 COZE_PROJECT_ENV !== 'PROD' 判断 dev 模式，
      # 不设置会在容器内以开发模式运行 Next（慢、占内存）。
      COZE_PROJECT_ENV: PROD
      # 写接口（/api/update、/api/simulation/buy、/api/simulation/reset）鉴权令牌。
      # 留空时仅放行回环地址；经反向代理/公网访问时必须设置一个强随机值。
      # 不会下发到前端：页面「立即更新数据」按钮走 /api/update/ui，由服务端代持转发。
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      # 站内按钮通道：「立即更新数据」「立即买入」「重置账本」的冷却秒数
      # （详见 docs/deploy/Deploy.md 第 7.1 节；0 表示只做单飞不限频）
      # UI_UPDATE_COOLDOWN_SECONDS: "30"   # 立即更新数据
      # UI_BUY_COOLDOWN_SECONDS: "10"      # 立即买入
      # UI_RESET_COOLDOWN_SECONDS: "10"    # 重置账本
      # 定时任务（详见 docs/deploy/Deploy.md 第 7 节）
      # ENABLE_INTERNAL_CRON: "true"   # 进程内调度开关；改由平台定时触发器驱动时设为 false
      # CRON_GRACE_MINUTES: "60"       # 补跑窗口（分钟），容器重启后追平当天错过的任务；0 关闭补跑
      # CRON_MAX_ATTEMPTS: "5"         # 单任务单日最大尝试次数
      # 存储驱动（详见 docs/deploy/Deploy.md 第 8.2 节）
      # duckdb（默认）：数据落 /app/data 持久卷
      # cloudbase     ：数据落 CloudBase PostgreSQL，需额外提供下面两个变量
      # STORAGE_DRIVER: cloudbase
      # CLOUDBASE_ENV_ID: xingxingyingyu-xxxxxxxx
      # CLOUDBASE_API_KEY: <云开发 API Key，等同数据库 service_role 权限，勿提交进仓库>
      # 模拟盘参数（可选，不设置则用代码默认值）
      # SIMULATE_INITIAL_CAPITAL: "100000"
      # SIMULATE_BET_COUNT: "10"
      # SIMULATE_BET_COST: "2"
    volumes:
      - shuangseqiu-data:/app/data
    # 让进程收到 SIGTERM 后有足够时间落盘 / 回放 WAL
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  shuangseqiu-data:
